<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kirakiraaa~</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #c8c8c8;
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6vh 1.5rem 4rem;
  }
  .wrap { width: 100%; max-width: 720px; }
  .ascii-hero { line-height: 0; margin-bottom: 2.5rem; }
  #ascii-canvas { display: block; will-change: transform; }
  .tagline {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 3rem;
    font-style: italic;
  }
  .tagline span { color: #e8b4f8; }
  .section { margin-bottom: 2.5rem; }
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #555;
    margin-bottom: 0.75rem;
  }
  .section-title::before { content: '// '; color: #333; }
  .links { list-style: none; }
  .links li { margin-bottom: 0.4rem; }
  .links a {
    color: #c8c8c8;
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.15s;
  }
  .links a:hover { color: #e8b4f8; }
  .links a::before { content: '> '; color: #444; }
  .bio {
    font-size: 0.85rem;
    line-height: 1.7;
    color: #999;
  }
  .footer {
    margin-top: auto;
    padding-top: 3rem;
    font-size: 0.7rem;
    color: #333;
    text-align: center;
    width: 100%;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ascii-hero">
    <canvas id="ascii-canvas"></canvas>
  </div>

  <p class="tagline"><span>$</span> i like cats, squids, and kirakira</p>

  <div class="section">
    <div class="section-title">me</div>
    <p class="bio">information: living, human, does not have cancer<br>我是人你知道吗</p>
  </div>

  <div class="section">
    <div class="section-title">websites</div>
    <ul class="links">
      <li><a href="https://badapple.kirakira.cloud">Bad Apple Pretext</a></li>
      <li><a href="https://blog.kirakira.cloud">Kira's Blog</a></li>
      <li><a href="https://its-kirakira.com">Old Website</a></li>
    </ul>
  </div>

  <div class="section">
    <div class="section-title">links</div>
    <ul class="links">
      <li><a href="https://github.com/kirakira-dev">github</a></li>
      <li><a href="https://hackerone.com/spl_kirakira">hackerone</a></li>
    </ul>
  </div>
</div>

<div class="footer">~ fin ~</div>
<canvas id="follower-canvas"></canvas>

<script>
const CHARS = '.:+-=*#@&~<>{}[]|/\\';
const SPRING = 0.04;
const DAMP = 0.88;

const canvas = document.getElementById('ascii-canvas');
const heroEl = canvas.closest('.ascii-hero');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);

const accent = '#e8b4f8';

const isMobile = window.innerWidth <= 600;
const STEP = isMobile ? 2 : 4;
const CHAR_SIZE = isMobile ? 3 : 6;
const MOUSE_R = isMobile ? 50 : 100;
const MOUSE_F = isMobile ? 5 : 3;
const baseFontSize = 80;
const H = isMobile ? 58 : 100;
const parentW = heroEl.offsetWidth;

canvas.style.width = parentW + 'px';
canvas.style.height = H + 'px';
canvas.width = parentW * dpr;
canvas.height = H * dpr;
ctx.scale(dpr, dpr);

function renderText() {
  const tmp = document.createElement('canvas').getContext('2d');
  tmp.font = `600 ${baseFontSize}px "IBM Plex Mono", monospace`;
  const fullW = tmp.measureText('kirakiraaa~').width;
  const scale = (parentW / fullW) * 0.95;

  const mainSize = Math.floor(baseFontSize * scale);
  const a1Size = Math.floor(mainSize * 0.82);
  const a2Size = Math.floor(mainSize * 0.64);

  const scaledH = Math.max(H, Math.ceil(mainSize * 1.3));
  canvas.style.height = scaledH + 'px';
  canvas.width = parentW * dpr;
  canvas.height = scaledH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const off = document.createElement('canvas');
  off.width = parentW;
  off.height = scaledH;
  const oc = off.getContext('2d');

  const baseY = scaledH / 2;

  oc.font = `600 ${mainSize}px "IBM Plex Mono", monospace`;
  oc.fillStyle = '#fff';
  oc.textBaseline = 'alphabetic';

  const metrics = oc.measureText('kirakira');
  const baseline = baseY + metrics.actualBoundingBoxAscent / 2;

  oc.fillText('kirakira', 0, baseline);
  let xOff = metrics.width;

  oc.font = `600 ${a1Size}px "IBM Plex Mono", monospace`;
  const m1 = oc.measureText('a');
  oc.fillText('a', xOff, baseline);
  xOff += m1.width;

  oc.font = `600 ${a2Size}px "IBM Plex Mono", monospace`;
  const m2 = oc.measureText('a');
  oc.fillText('a', xOff, baseline);
  xOff += m2.width;

  oc.font = `600 ${a2Size}px "IBM Plex Mono", monospace`;
  oc.fillText('~', xOff, baseline);

  return { off, scaledH };
}

document.fonts.ready.then(() => {
  const { off, scaledH } = renderText();
  const img = off.getContext('2d').getImageData(0, 0, parentW, scaledH);

  const particles = [];

  for (let y = 0; y < scaledH; y += STEP) {
    for (let x = 0; x < parentW; x += STEP) {
      const i = (y * parentW + x) * 4;
      if (img.data[i + 3] > 100) {
        particles.push({
          x: x + (Math.random() - 0.5) * parentW * 0.5,
          y: y + (Math.random() - 0.5) * scaledH * 2.5,
          tx: x, ty: y,
          vx: 0, vy: 0,
          char: CHARS[Math.floor(Math.random() * CHARS.length)],
          a: 0,
          ta: isMobile ? 0.95 + Math.random() * 0.05 : 0.85 + Math.random() * 0.15,
          text: true,
          phase: Math.random() * Math.PI * 2,
          delay: (x / parentW) * 1.2,
        });
      }
    }
  }

  const ambientCount = Math.max(30, Math.floor(particles.length * 0.15));
  for (let i = 0; i < ambientCount; i++) {
    const px = Math.random() * parentW;
    const py = Math.random() * scaledH;
    particles.push({
      x: px, y: py,
      tx: px, ty: py,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      char: CHARS[Math.floor(Math.random() * CHARS.length)],
      a: 0,
      ta: 0.04 + Math.random() * 0.07,
      text: false,
      phase: Math.random() * Math.PI * 2,
      delay: Math.random() * 0.6,
    });
  }

  let mx = -9999, my = -9999;
  canvas.addEventListener('mousemove', (e) => {
    const r = canvas.getBoundingClientRect();
    mx = e.clientX - r.left;
    my = e.clientY - r.top;
  }, { passive: true });
  canvas.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });
  canvas.addEventListener('touchstart', (e) => {
    const r = canvas.getBoundingClientRect();
    mx = e.touches[0].clientX - r.left;
    my = e.touches[0].clientY - r.top;
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    const r = canvas.getBoundingClientRect();
    mx = e.touches[0].clientX - r.left;
    my = e.touches[0].clientY - r.top;
  }, { passive: true });
  canvas.addEventListener('touchend', () => { mx = -9999; my = -9999; });

  const t0 = performance.now();

  ctx.font = `500 ${CHAR_SIZE}px "IBM Plex Mono", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  function frame(now) {
    const elapsed = (now - t0) / 1000;
    ctx.clearRect(0, 0, parentW, scaledH);
    ctx.fillStyle = accent;

    for (const p of particles) {
      const t = Math.max(0, elapsed - p.delay);

      if (p.text && t < 0.01) {
        ctx.globalAlpha = 0.02;
        ctx.fillText(p.char, p.x, p.y);
        continue;
      }

      p.vx += (p.tx - p.x) * SPRING;
      p.vy += (p.ty - p.y) * SPRING;

      const dx = p.x - mx;
      const dy = p.y - my;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < MOUSE_R && d > 0) {
        const f = ((1 - d / MOUSE_R) ** 2) * MOUSE_F;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }

      p.vx *= DAMP;
      p.vy *= DAMP;
      p.x += p.vx;
      p.y += p.vy;

      p.a += (p.ta - p.a) * 0.04;

      if (p.text) {
        p.a = p.ta + Math.sin(elapsed * 0.8 + p.phase) * 0.08;
        if (t < 0.8 || Math.random() < 0.0008) {
          p.char = CHARS[Math.floor(Math.random() * CHARS.length)];
        }
      } else {
        p.tx += (Math.random() - 0.5) * 0.2;
        p.ty += (Math.random() - 0.5) * 0.2;
        if (p.x < -20) p.x = p.tx = parentW + 10;
        if (p.x > parentW + 20) p.x = p.tx = -10;
        if (p.y < -20) p.y = p.ty = scaledH + 10;
        if (p.y > scaledH + 20) p.y = p.ty = -10;
        if (Math.random() < 0.003) {
          p.char = CHARS[Math.floor(Math.random() * CHARS.length)];
        }
      }

      ctx.globalAlpha = Math.max(0, p.a);
      ctx.fillText(p.char, p.x, p.y);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
});
</script>

<script>
(function() {
  const pastel = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8b4f8', '#ffc4e1'];
  const followerChars = '.:+-=*#@&~<>{}[]|/\\';
  const fCanvas = document.getElementById('follower-canvas');
  const fCtx = fCanvas.getContext('2d');
  const fdpr = Math.min(window.devicePixelRatio || 1, 2);
  const fisMobile = window.innerWidth <= 600;
  const fSize = fisMobile ? 10 : 14;

  function resizeFollower() {
    fCanvas.width = window.innerWidth * fdpr;
    fCanvas.height = window.innerHeight * fdpr;
    fCanvas.style.width = window.innerWidth + 'px';
    fCanvas.style.height = window.innerHeight + 'px';
    fCtx.setTransform(fdpr, 0, 0, fdpr, 0, 0);
  }
  resizeFollower();
  window.addEventListener('resize', resizeFollower);

  const followers = [];
  const maxFollowers = fisMobile ? 25 : 50;
  let fmx = -9999, fmy = -9999;
  let pmx = -9999, pmy = -9999;
  let hasPointer = false;

  function spawnFollower(sx, sy, mvx, mvy) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 20 + 5;
    const spread = 1.5;
    followers.push({
      x: sx + Math.cos(angle) * dist,
      y: sy + Math.sin(angle) * dist,
      vx: mvx * 0.4 + (Math.random() - 0.5) * spread,
      vy: mvy * 0.4 + (Math.random() - 0.5) * spread - Math.random() * 2,
      char: followerChars[Math.floor(Math.random() * followerChars.length)],
      color: pastel[Math.floor(Math.random() * pastel.length)],
      a: 0,
      ta: 0.7 + Math.random() * 0.3,
      phase: Math.random() * Math.PI * 2,
      gravity: 0.15 + Math.random() * 0.15,
      drag: 0.96 + Math.random() * 0.02,
    });
  }

  function burst(sx, sy) {
    const count = fisMobile ? 12 : 24;
    for (let i = 0; i < count && followers.length < maxFollowers; i++) {
      spawnFollower(sx, sy, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8 - Math.random() * 5);
    }
  }

  document.addEventListener('mousemove', (e) => {
    fmx = e.clientX;
    fmy = e.clientY;
    hasPointer = true;
  }, { passive: true });
  document.addEventListener('mouseleave', () => { hasPointer = false; });
  document.addEventListener('click', (e) => {
    fmx = e.clientX;
    fmy = e.clientY;
    burst(fmx, fmy);
  });
  document.addEventListener('touchstart', (e) => {
    fmx = e.touches[0].clientX;
    fmy = e.touches[0].clientY;
    hasPointer = true;
    burst(fmx, fmy);
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    fmx = e.touches[0].clientX;
    fmy = e.touches[0].clientY;
    hasPointer = true;
  }, { passive: true });
  document.addEventListener('touchend', () => { hasPointer = false; });

  const ft0 = performance.now();
  fCtx.font = `500 ${fSize}px "IBM Plex Mono", monospace`;
  fCtx.textAlign = 'center';
  fCtx.textBaseline = 'middle';

  function fFrame(now) {
    const elapsed = (now - ft0) / 1000;
    fCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    let mvx = 0, mvy = 0;
    if (pmx > -9998) {
      mvx = fmx - pmx;
      mvy = fmy - pmy;
    }
    pmx = fmx;
    pmy = fmy;

    const speed = Math.sqrt(mvx * mvx + mvy * mvy);
    const spawnChance = Math.min(0.6, speed * 0.04 + 0.05);
    if (hasPointer && followers.length < maxFollowers && Math.random() < spawnChance) {
      spawnFollower(fmx, fmy, mvx, mvy);
    }

    for (let i = followers.length - 1; i >= 0; i--) {
      const f = followers[i];
      f.a += (f.ta - f.a) * 0.06;

      f.vy += f.gravity;
      f.vx *= f.drag;
      f.vy *= f.drag;
      f.x += f.vx;
      f.y += f.vy;

      if (f.y > window.innerHeight + 30 || f.x < -30 || f.x > window.innerWidth + 30) {
        followers.splice(i, 1);
        continue;
      }

      if (Math.random() < 0.005) {
        f.char = followerChars[Math.floor(Math.random() * followerChars.length)];
      }

      fCtx.save();
      fCtx.globalAlpha = Math.max(0, f.a);
      fCtx.fillStyle = f.color;
      fCtx.fillText(f.char, f.x, f.y);
      fCtx.restore();
    }

    fCtx.globalAlpha = 1;
    requestAnimationFrame(fFrame);
  }

  requestAnimationFrame(fFrame);
})();
</script>

<style>
  #follower-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
  }
</style>
</body>
