<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Kirakira</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 20%, #f9a8d4 40%, #f472b6 60%, #ec4899 80%, #db2777 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(236, 72, 153, 0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .auth-container {
            padding: 2rem;
        }

        .chat-container {
            display: none;
            flex-direction: column;
            height: 600px;
        }

        .chat-container.active {
            display: flex;
        }

        h1 {
            color: #ec4899;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 2rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #fbcfe8;
            background: white;
            color: #831843;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            color: white;
            border-color: #ec4899;
        }

        .tab:hover {
            border-color: #ec4899;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            color: #831843;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #fbcfe8;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #ec4899;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .chat-header {
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            color: white;
            margin: 0;
            font-size: 1.25rem;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            width: auto;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #fdf2f8;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: white;
            border-radius: 0.5rem;
            border-left: 3px solid #ec4899;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .message-username {
            font-weight: 600;
            color: #ec4899;
        }

        .message-time {
            font-size: 0.75rem;
            color: #9f1239;
        }

        .message-content {
            color: #831843;
        }

        .message-input-container {
            padding: 1rem;
            background: white;
            border-top: 2px solid #fbcfe8;
            display: flex;
            gap: 0.5rem;
        }

        .message-input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #fbcfe8;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        .send-btn {
            width: auto;
            padding: 0.75rem 1.5rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #ec4899;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div class="auth-container" id="authContainer">
            <h1>Chat</h1>
            <div class="tabs">
                <button class="tab active" data-tab="login">Login</button>
                <button class="tab" data-tab="signup">Sign Up</button>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">Login</button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" style="display: none;">
                <div class="form-group">
                    <label for="signupUsername">Username</label>
                    <input type="text" id="signupUsername" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>

            <a href="/" class="back-link">← Back to Home</a>
        </div>

        <!-- Chat Section -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <h2>Public Chat</h2>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
            <div class="messages" id="messages"></div>
            <div class="message-input-container">
                <input type="text" class="message-input" id="messageInput" placeholder="Type a message...">
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
        const VPS_API_URL = `${protocol}//76.13.24.155/api`;
        const LOCAL_MESSAGES_FILE = './messages.json';
        
        let currentToken = localStorage.getItem('chatToken');
        let currentUsername = localStorage.getItem('chatUsername');
        let usersData = [];

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function generateToken() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
        }

        async function loadUsers() {
            try {
                const response = await fetch('./users.json');
                if (response.ok) {
                    usersData = await response.json();
                } else {
                    usersData = [];
                }
            } catch (error) {
                console.error('Error loading users:', error);
                usersData = [];
            }
        }

        async function saveUsers() {
            try {
                localStorage.setItem('chatUsers', JSON.stringify(usersData));
            } catch (error) {
                console.error('Error saving users:', error);
            }
        }

        loadUsers();

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const tabType = this.getAttribute('data-tab');
                if (tabType === 'login') {
                    document.getElementById('loginForm').style.display = 'block';
                    document.getElementById('signupForm').style.display = 'none';
                } else {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('signupForm').style.display = 'block';
                }
                hideMessages();
            });
        });

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
            setTimeout(() => successEl.classList.remove('show'), 3000);
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                if (usersData.length === 0) {
                    await loadUsers();
                }

                const hashedPassword = await hashPassword(password);
                const user = usersData.find(u => u.username === username && u.password === hashedPassword);

                if (user) {
                    const token = generateToken();
                    user.token = token;
                    await saveUsers();

                    currentToken = token;
                    currentUsername = username;
                    localStorage.setItem('chatToken', token);
                    localStorage.setItem('chatUsername', username);
                    showChat();
                } else {
                    showError('Invalid username or password');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Login error: ' + error.message);
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;

            try {
                if (usersData.length === 0) {
                    await loadUsers();
                }

                if (usersData.find(u => u.username === username)) {
                    showError('Username already exists');
                    return;
                }

                const hashedPassword = await hashPassword(password);
                const token = generateToken();

                const newUser = {
                    username,
                    password: hashedPassword,
                    token,
                    createdAt: new Date().toISOString()
                };

                usersData.push(newUser);
                await saveUsers();

                currentToken = token;
                currentUsername = username;
                localStorage.setItem('chatToken', token);
                localStorage.setItem('chatUsername', username);
                showSuccess('Account created successfully!');
                setTimeout(() => showChat(), 1000);
            } catch (error) {
                console.error('Signup error:', error);
                showError('Signup error: ' + error.message);
            }
        });

        function showChat() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            loadMessages();
            startPolling();
        }

        async function loadMessages() {
            if (!currentToken) return;

            try {
                const response = await fetch(LOCAL_MESSAGES_FILE);
                if (response.ok) {
                    const messages = await response.json();
                    displayMessages(messages);
                } else {
                    displayMessages([]);
                }
            } catch (error) {
                console.error('Error loading messages:', error);
                displayMessages([]);
            }
        }

        function displayMessages(messages) {
            const messagesEl = document.getElementById('messages');
            messagesEl.innerHTML = '';

            if (messages.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.color = '#9f1239';
                emptyMsg.style.padding = '2rem';
                emptyMsg.textContent = 'No messages yet. Be the first to send one!';
                messagesEl.appendChild(emptyMsg);
                return;
            }

            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                
                const header = document.createElement('div');
                header.className = 'message-header';
                
                const username = document.createElement('span');
                username.className = 'message-username';
                username.textContent = msg.username;
                
                const time = document.createElement('span');
                time.className = 'message-time';
                time.textContent = new Date(msg.timestamp).toLocaleTimeString();
                
                header.appendChild(username);
                header.appendChild(time);
                
                const content = document.createElement('div');
                content.className = 'message-content';
                content.textContent = msg.message;
                
                messageDiv.appendChild(header);
                messageDiv.appendChild(content);
                messagesEl.appendChild(messageDiv);
            });

            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !currentToken) {
                console.log('Cannot send - message:', message, 'token:', currentToken);
                return;
            }

            try {
                console.log('Sending message to VPS...');
                
                const response = await fetch(`${VPS_API_URL}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({ message })
                });

                if (response.ok) {
                    input.value = '';
                    const data = await response.json();
                    console.log('Message sent successfully:', data);
                    showSuccess('Message sent!');
                    setTimeout(() => loadMessages(), 500);
                } else {
                    const data = await response.json();
                    showError(data.error || 'Failed to send message');
                    console.error('Send failed:', data);
                }
            } catch (error) {
                showError('Failed to send message: ' + error.message);
                console.error('Send error:', error);
            }
        }

        // Wait for DOM to be ready before attaching listeners
        document.addEventListener('DOMContentLoaded', function() {
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');
            
            if (sendBtn) {
                sendBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Send button clicked');
                    sendMessage();
                });
            }
            
            if (messageInput) {
                messageInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        console.log('Enter pressed');
                        sendMessage();
                    }
                });
            }
        });

        let pollingInterval;
        function startPolling() {
            pollingInterval = setInterval(loadMessages, 2000);
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentToken = null;
            currentUsername = null;
            localStorage.removeItem('chatToken');
            localStorage.removeItem('chatUsername');
            stopPolling();
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('chatContainer').classList.remove('active');
        });

        if (currentToken && currentUsername) {
            showChat();
        }
    </script>
</body>
</html>
